<!DOCTYPE html>
<html>
<head>

	<title>Peak Theatre</title>
	<link rel="stylesheet" type="text/css" href="global/style.css">
</head>
<body>

	<div class="library"></div>

	<div class="profile-wrapper">

		</div>
	</div>

	<script type="module" src="global/scripts/main.js"></script>

</html>
